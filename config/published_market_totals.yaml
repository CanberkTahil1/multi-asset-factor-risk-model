# =============================================================================
# config/published_market_totals.yaml -- published year-end market totals, for
# the comparison column of reports/equity_market_cap.md.
#
# SPEC.md 15.4.3 ruling (i) asks for the estimation universe's total cap, with
# and without the consistency screen, "beside the index's published total".
# The S&P 500's own historical year-end total market value was NOT found in a
# free, citable form on 2026-09-05 (S&P Dow Jones Indices' factsheet carries
# the current figure only; the paid terminals carry the history). What was
# found is the TOTAL US EQUITY MARKET value -- every US-based company listed on
# the NYSE, Nasdaq and OTCQX -- which is a SUPERSET of the index and therefore
# an UPPER BOUND on its total, not the index's total. The report labels the
# column exactly that way. A raw universe total ABOVE this bound is
# impossible for a correct panel (row 274's falsifier); a screened total below
# it is consistent, not confirmed.
#
# HOW TO FILL A ROW. Read the value from the source page and record the URL
# and the date read. Values are as displayed, in the stated unit; the code
# converts. Nothing here is estimated and nothing may be copied from memory.
#
# Filled 2026-09-05 from Siblis Research's "Total Market Value of the U.S.
# Stock Market" table (USD millions).
# =============================================================================

